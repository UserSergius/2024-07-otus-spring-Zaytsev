databaseChangeLog:
  - changeSet:
      id: 00-create-authors
      author: sergey
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: full_name
                  type: VARCHAR(255)

  - changeSet:
      id: 01-create-genres
      author: sergey
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)

  - changeSet:
      id: 02-create-books
      author: sergey
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_books_authors
                    references: authors(id)
                    onDelete: cascade
              - column:
                  name: genre_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_books_genres
                    references: genres(id)
                    onDelete: cascade